regressions:
  - "Pricing lookups (#1846): verify live (pricing.twilio.com) that getPricingMessagingCountries / getPricingPhoneNumberCountries / getPricingVoiceCountries / getPricingTrunkingCountries return every country across pages (PageSize 1000), that the single-country lookups (for example DE) return prices as decimal strings with the price unit in lower or upper case as Twilio sends it, that getPricingMessagingCountry lists outbound prices per carrier (mcc, mnc) and number type, that getPricingVoiceNumber and getPricingTrunkingNumber work for a destination number with and without originationNumber (the + in the path), and that inboundCallPrice is unset for a number that is not yours. Prices are reference data, so compare one against the Twilio pricing page."
  - "VoiceDefaultRecordingConfiguration and VoiceDefaultTranscriptionConfiguration (#1666): verify live that POST /v2/Configurations/{Type}/Default with configuration_id answers 204 for an existing configuration and 404 for an unknown one, that GET on the same path answers the selected configuration (with id and account_sid) and 404 when none is set, and that Twilio really offers no call to unset the default. The provider uses the account SID from the GET as the resource ID and falls back to the authenticated account SID when it is absent."
  - "Dialing permissions lookups (#1665): verify live that getDialingPermissionsCountry for a country you know (for example DE) returns calling codes as text, the three permissions as booleans (and what Twilio sends for a permission that is not set), that getDialingPermissionsCountries with no filter returns every country across pages, that the Continent, CountryCode and boolean filters narrow it, and that getDialingPermissionsHighRiskSpecialPrefixes returns prefixes with the country code (an empty list for a country with none). Also capture one real BulkCountryUpdates request and response so the write side (#1665) can be designed from the true wire format."
  - "VoiceAccountDefaultRecordingConfiguration (#1666): verify live that POST /v2/AccountDefaultConfiguration/Recording creates the account default (201) and answers 409 when one exists, that GET answers 404 when there is none, that PUT replaces the whole configuration and does not need an ETag or If-Match header (the spec lists a 412 for an ETag mismatch but documents no header), that DELETE removes it, and that the response carries account_sid (the provider uses it as the resource ID) and no id. getVoiceAccountDefaultRecordingConfiguration reads it and fails when none exists."
  - "#1742 a VoiceTranscriptionConfiguration and a VoiceRecordingConfiguration whose features[0].featureId is ${transcription.configurationId} (type transcriptionConfiguration): pulumi preview succeeds with no featureId error, pulumi up creates both and the recording configuration reports the feature, a second preview shows no change. A literal empty featureId must still fail the preview. The same wiring must preview for VoiceTranscriptionConfiguration participantDefaults values, EventSubscription types[].type and VerifyWebhook eventTypes elements taken from another resource's output"
  - "Voice v2 configurations (#1666): create a VoiceTranscriptionConfiguration (engine deepgram, model nova-3, language en-US, participantDefaults for channels 1 and 2, a status callback url) and a VoiceRecordingConfiguration whose features entry references its configurationId, with a compositionPolicy and a call status callback; refresh and preview show no change, also when the program omits the callback methods. Change the descriptions, the language and a callback url (PUT, same ID), remove a feature or the policy and check what Twilio keeps. Import each by ID and the first preview plans no change; getVoiceRecordingConfiguration and getVoiceTranscriptionConfiguration take the ID or the unique name. Not verified against a live account (the Voice v2 definition is version 0.0.1): whether PUT replaces or merges (the provider sends the whole configuration and leaves unset fields out), whether Twilio defaults a callback method to POST or adds other defaults on read, whether uniqueName can change, and the exact rules for participantDefaults (the provider leaves them to Twilio)."
  - "#1715 pulumi import of an ID that does not exist (for example twilio:index:ShortCode s SC00000000000000000000000000000001, Address, ApiKey, Application, Queue, Subaccount) fails with 'does not exist' and leaves nothing in state; a refresh of a resource deleted outside Pulumi still drops it from state"
  - "#1716 import a ServerlessEnvironment created with domainSuffix stg (pulumi import twilio:index:ServerlessEnvironment e <serviceSid>/ZE...), then pulumi preview --expect-no-changes against the program that created it: no replace of the environment or its variables, and the imported inputs carry domainSuffix; an environment created without a suffix imports without one; stating a different suffix still plans a replace"
  - "#1717 create: VerifyMessagingConfiguration for DE on a fresh Verify service either succeeds and a following refresh --expect-no-changes keeps it (the list endpoint shows DE), or fails at create with 'accepted the request without creating it' and leaves nothing in the state; it must never be stored and then dropped by refresh"
  - "#1717 on a VerifyService with no configuration for FR: getVerifyMessagingConfiguration (FR) fails with was not found and pulumi import twilio:index:VerifyMessagingConfiguration m <serviceSid>/FR fails instead of storing an empty resource; after pulumi destroy of a created DE configuration the lookup for DE fails and a refresh of a stack that still lists it drops it from state"
  - "#1743 import: create an Application with no voiceMethod (Twilio shows POST), pulumi import it, then write the program with voiceMethod: POST (and smsMethod: post): pulumi preview --expect-no-changes shows no change; the same program with voiceMethod: GET plans one update, and removing it again plans one update that resets to POST"
  - "#1680 import a SipDomain created with sipRegistration: true, then pulumi preview --expect-no-changes against the same program: no update; a SipDomain created without it imports without sipRegistration and previews clean"
  - "#1681 import a VerifyService created with totpCodeLength 7, totpSkew 2, totpTimeStep 20: the imported inputs contain all three and preview --expect-no-changes is clean; a service on the defaults (6, 1, 30) imports none of them"
  - "#1679 import a UsageTrigger (pulumi import twilio:index:UsageTrigger t UT...), then pulumi preview --expect-no-changes against the program that created it (no triggerBy, and again with callbackMethod: POST): no replace and no update; setting triggerBy to a different value still plans a replace"
  - "Assigned add-ons (#1431 part 13): with an add-on installed from the Marketplace, assign it to an owned number with IncomingPhoneNumberAssignedAddOn (phoneNumberSid, installedAddOnSid); refresh and preview show no change, and getIncomingPhoneNumberAssignedAddOn returns its friendlyName, configuration and extensions. Changing installedAddOnSid replaces it (Twilio has no update). Import <phoneNumberSid>/<sid>: the first preview plans only an in-place update of installedAddOnSid that calls no API (Twilio never returns it), and a later change of it replaces. Destroy unassigns it; destroying twice is a no-op. Not verified against a live account: whether the assignment SID equals the installed add-on SID and what Twilio answers when the same add-on is assigned twice."
  - "Lookups (#1431 part 12): getAvailablePhoneNumbers for US local returns numbers whose phoneNumber is E.164 and whose capabilities match the smsEnabled and voiceEnabled filters, numberType tollFree and mobile hit their own paths, and limit caps the list; nothing is purchased. getUsageRecords for allTime and thisMonth returns the same categories as the console, price stays a decimal string; getAuthorizedConnectApps lists the apps shown under Authorized Connect Apps; getEventTypes lists the types the console offers for a subscription and getEventSchema reports the latest version. A schemaId that does not exist must fail with 'was not found'."
  - "BYOC (#1431 part 11): create a ConnectionPolicy with two ConnectionPolicyTargets (different priority and weight), a ByocTrunk with connectionPolicySid pointing at the policy, an IpRecord and a SourceIpMapping to a SipDomain; refresh and preview show no change. Changing the trunk friendlyName and voiceMethod, a target priority, weight and enabled flag, the record friendlyName and the mapping sipDomainSid updates in place (no replacement); changing a record ipAddress or cidrPrefixLength, a target connectionPolicySid or a mapping ipRecordSid replaces. Removing the trunk voiceUrl or connectionPolicySid clears it. Import each (SID, or <connectionPolicySid>/<sid> for a target) and the first preview plans no change, also when the program states priority 10, weight 10, enabled true or cidrPrefixLength 32. Destroying a policy removes its targets. Not verified against a live account: whether Twilio accepts an empty ConnectionPolicySid or FromDomainSid to detach, and whether it normalizes ipAddress."
  - "Serverless (#1431 part 10): create a ServerlessService, a ServerlessEnvironment with a domainSuffix, a ServerlessVariable, a ServerlessFunction and a ServerlessAsset; refresh and preview show no change. Changing the service friendlyName, the variable key and value, and the function friendlyName updates in place (no replacement); changing the environment domainSuffix or uniqueName replaces it. The variable value never appears in plaintext in the state. Import each (<serviceSid>, <serviceSid>/<sid>, <serviceSid>/<environmentSid>/<sid>) and the first preview plans no change, also when the program omits includeCredentials and uiEditable. Destroying the service removes the children and destroying a child afterwards is a no-op. Not verified against a live account: the defaults of includeCredentials and uiEditable, the limit of 16 characters on domainSuffix and whether Twilio returns the variable value on read."
  - "Serverless deploy plane (#1664): in one program create a ServerlessService, ServerlessEnvironment, ServerlessFunction (+ ServerlessFunctionVersion with a handler that returns a fixed string, visibility public), ServerlessAsset (+ ServerlessAssetVersion, path /hello.txt), a ServerlessBuild over both versions and a ServerlessDeployment of it to the environment; curl https://<domainName>/<function path> returns the string and the asset path serves the text. Regression checks: (1) the upload host works as coded (multipart POST to serverless-upload.twilio.com; try also with a configured edge/region and report whether it still resolves); (2) build creation waits for completed and a deliberately broken dependency name fails the create with the build removed; (3) refresh and preview show no change after the first up, also for the version resources and the build when the program omits runtime; (4) changing the function code replaces the version, then the build and deployment replace in the same up when they reference the new SIDs, and the old deployment is not an error; (5) pulumi destroy of the whole program succeeds (#1856): the deployment and versions are forgotten, a deployed build and a function or asset whose version a build holds answer 400/20001 and are forgotten with a warning, and the service delete removes what is left; confirm on a live account that the exact 20001 messages still contain 'active Deployment' and 'referenced in a Build' and that nothing is left after the service is gone; (6) import each of <serviceSid>/<functionSid>/<sid>, <serviceSid>/<assetSid>/<sid>, <serviceSid>/<sid> (build) and <serviceSid>/<environmentSid>/<sid> and preview plans no change (function version imports read the code back through /Content; asset version imports plan no change when the program sets content)."
  - "Conversations (#1864, part of #1667): create a ConversationsService, a ConversationsServiceConfiguration naming a service role made with ConversationsRole (roleType service, chatServiceSid set), a ConversationsRole with no chatServiceSid and a ConversationsAddressConfiguration for an sms number the account owns with autoCreation enabled and type default; refresh and preview show no change. Changing the service friendlyName replaces it, changing role permissions, the address friendlyName and autoCreation, and reachabilityEnabled updates in place. A ConversationsWebhookConfiguration with a chatServiceSid sets pre and post URLs and filters, and the order of the filters is not drift. Import each (<sid>, <chatServiceSid>/<sid> for a service role, the service SID for the configurations, account for the account-level webhook configuration) and the first preview plans no change. Not verified against a live account: that a configuration POST with no parameters is accepted (the provider does a GET instead when nothing is set), the default autoCreation values Twilio reports, whether the account-level webhook configuration needs method and URLs together, and the exact APNs certificate validation."
  - "Video settings (#1902, part of #1667): VideoCompositionSettings and VideoRecordingSettings are not run automatically (they change where every composition or recording of the account is stored). Read them with getVideoCompositionSettings and getVideoRecordingSettings. On a throwaway account create each with friendlyName only, then add awsCredentialsSid, awsS3Url and awsStorageEnabled for a bucket the owner controls; refresh and preview show no change, changing friendlyName updates in place. Import as default and the first preview plans no change when the program states only what differs from Twilio defaults (awsStorageEnabled and encryptionEnabled false). Destroy leaves the settings on Twilio. Not verified against a live account: whether Twilio validates the bucket and credential when they are saved, and what it reports for friendlyName on an account that never set it."
  - "Video composition hook (#1901, part of #1667): create a VideoCompositionHook with enabled false, a videoLayout, audioSources, resolution 1280x720 and format mp4; refresh and preview show no change. Changing friendlyName and the status callback updates in place; setting audioSourcesExcluded to an empty list clears it. Import the SID and the first preview plans no change when the program states only what differs from Twilio defaults (resolution 640x480, trim true, statusCallbackMethod POST). Not verified against a live account: the defaults Twilio reports for enabled and format, how it takes an empty list, and whether it accepts a hook with no layout or audio sources."
  - "Super SIM and Wireless (#1923, part of #1667): list the catalog with getSuperSimNetworks (isoCountry US, or mcc and mnc), create a SuperSimNetworkAccessProfile with uniqueName and networks holding two of the returned SIDs, then a SuperSimFleet naming it by SID and then by unique name in a second program; refresh and preview show no change. Changing the profile uniqueName and swapping a network updates in place; changing the Fleet dataLimit, uniqueName, networkAccessProfile and the commands URLs updates in place, changing dataEnabled or smsCommandsEnabled replaces the Fleet (Twilio cannot update them). Destroy forgets both (Twilio has no delete for either), so use a fresh uniqueName on the next run. Import the SIDs and the first preview plans no change. A WirelessRatePlan with uniqueName, dataLimit and internationalRoaming updates uniqueName and friendlyName in place and replaces on any other change; read it with getWirelessRatePlan; destroy deletes it unless SIMs still use it. Not verified against a live account: whether Twilio accepts a profile with no networks, the smsCommandsEnabled default it applies (the spec says true on create and false on read), whether it reports international_roaming as an empty list or null for a plan without roaming, whether the Rate Plan create needs a Programmable Wireless enabled account, and whether the unique name of a Fleet or profile can be looked up in place of its SID."
  - "Content templates (part of #1667): create a ContentTemplate with language en, a friendlyName, variables {\"1\": \"Ada\"} and types text (\"Hello {{1}}\") plus quickReply with two buttons; refresh and preview show no change; changing friendlyName and the text updates in place (no replacement). Read it with getContentTemplate and getContentApprovalStatus (whatsappStatus and whatsappJson are null for a template never submitted to WhatsApp). Import the HX SID and the first preview plans no change. Deleting it in the console makes the next refresh drop it. Not verified against a live account: that Twilio returns the types exactly as sent (no defaulted or empty sub-fields that would show as drift), the keys inside the untyped whatsapp approval object (status, rejection_reason and category are read from the Twilio docs), and which of the WhatsApp-only types a non-WhatsApp-enabled account accepts."
  - "Proxy (#1905, part of #1667): create a ProxyService with uniqueName, defaultTtl and geoMatchLevel area-code; refresh and preview show no change; changing uniqueName updates in place. Read it with getProxyService. Import the SID and the first preview plans no change when the program states only what differs from Twilio defaults (defaultTtl 0, geoMatchLevel country, numberSelectionBehavior prefer-sticky). With a spare number of the account add a ProxyPhoneNumber by phoneNumber, then by phoneNumberSid in a second program: the second preview plans no change; toggling isReserved updates in place, changing the number replaces; import <serviceSid>/<sid> (the import names the number by phoneNumberSid) and the first preview plans no change when the program names the number by phoneNumberSid or by phoneNumber and states isReserved only if it is true. Destroy removes the number from the pool and the number stays in the account. Not verified against a live account: the geoMatchLevel values Twilio accepts (the spec lists area-code, overlay, radius and country, the docs also name extended-area-code), and whether it reports defaultTtl as 0 or null for a new service."
  - "Messaging Service senders (#1913, part of #1667): on a MessagingService add a MessagingServiceAlphaSender with a short name and a MessagingServiceDestinationAlphaSender with and without isoCountryCode; refresh and preview show no change, any changed input replaces. Import <serviceSid>/<sid> and the first preview plans no change; read each with getMessagingServiceAlphaSender and getMessagingServiceDestinationAlphaSender. With a short code or channel sender of the account add a MessagingServiceShortCode (shortCodeSid) or MessagingServiceChannelSender (channelSenderSid); destroy removes it from the pool and keeps the sender. Not verified against a live account: whether Twilio refuses an alpha sender ID that is already in another Messaging Service, whether it reports iso_country_code null or empty for a default destination sender, the casing it reports for the country, and whether a sender can be added before the service is registered for the country."
  - "Accounts v1 (#1910, part of #1667): create a PublicKeyCredential with a throwaway public key and a friendlyName; refresh and preview show no change; changing friendlyName updates in place, changing publicKey replaces. Import the SID: the key is not returned, so the first preview plans no change when the program states it. Read it with getPublicKeyCredential. Add a number you own with AccountSafeListNumber (the plus sign must be escaped as %2B in the query), read it with getAccountSafeListNumber, destroy it; this is the Global SafeList of accounts.twilio.com, a different API from VerifySafeListNumber. getMessagingGeoPermissions lists every country, or the countries named in countryCodes. AwsCredential is not run automatically (real AWS keys); with a test IAM user create one, check preview is clean and that changing credentials replaces it. Not verified against a live account: whether Twilio validates the keys or the public key when they are stored, what a GET of a number that is not on the Global SafeList answers (the provider reads 404 and a reply without a phone_number as not on the list), whether the Global SafeList is enabled on every account, and what friendly_name Twilio reports for a credential created without one."
  - "IAM and messaging lookups (part of #1667): create an OAuthApp with a friendlyName and a policy allowing /twilio/iam/api-keys/create; the output has a sid (OQ...) and a secret that is marked secret in state, and the secret is never shown again. Preview and refresh show no change (Twilio has no read call), changing any input replaces the app, destroy deletes it, and importing an OAuth app fails with \"the Twilio API does not support reading OAuth apps\". getOAuthApp fails with exactly that message. getMessagingUsecases returns the use cases; getMessagingDeactivations for yesterday (date YYYY-MM-DD) returns a redirectUrl that is a secret output and downloads a file within about two minutes. getRolePermissions for an IX... role (accounts with IAM roles) lists its permissions."
  - "Voice Intelligence (#1897, part of #1667): create an IntelligenceService with uniqueName, friendlyName, languageCode and autoTranscribe false; refresh and preview show no change. Changing friendlyName and webhookUrl updates in place; changing languageCode replaces the service. Import the SID and the first preview plans no change when the program states only what differs from Twilio defaults (languageCode en-US, the redaction and transcription flags false). With a valid operator type and config create an IntelligenceCustomOperator; reformatting or reordering the config JSON plans no change, changing it updates in place, changing operatorType replaces it. Not verified against a live account: the defaults Twilio reports for a new service, whether it reports operator_type by name or SID, whether it accepts a service with no webhook, and which operator type configs it validates."
  - "Notify (#1872, part of #1667): create a NotifyService with friendlyName, logEnabled false and a messagingServiceSid; refresh and preview show no change. With a real FCM server key create a NotifyCredential (credentialType fcm, secret) and name it as fcmCredentialSid on the service; changing friendlyName and the callback URL updates in place, changing credentialType replaces the credential. Import each SID and the first preview plans no change when the program states only what differs from Twilio defaults (logEnabled true, deliveryCallbackEnabled false). The secret inputs never appear in plaintext in the state. Not verified against a live account: that Twilio accepts a service with no credential, how it reports the sandbox flag, and the default protocol versions it reports."
  - "Sync (#1870, part of #1667): create a SyncService with friendlyName, aclEnabled and reachabilityDebouncingWindow 2000; refresh and preview show no change. Changing friendlyName, webhookUrl and the flags updates in place. Import the service SID and the first preview plans no change when the program states only what differs from Twilio defaults (reachabilityDebouncingWindow 5000, every flag false). getSyncService reports the same settings. Not verified against a live account."
  - "Conversations notifications and defaults (#1866, part of #1667): on a ConversationsService create a ConversationsServiceNotificationConfiguration with logEnabled, newMessage (enabled, template, badgeCountEnabled, withMedia) and addedToConversation; refresh and preview show no change. Changing a template or flag updates in place; changing chatServiceSid replaces. A notification the program does not state is left as it is and is not drift. Import the service SID and the first preview plans no change. ConversationsConfiguration (not run automatically, it changes the whole account) sets defaultChatServiceSid and the inactive and closed timers and imports as account. Not verified against a live account: that a POST with a partial notification leaves the other notifications alone, the default template and sound values Twilio reports, and the minimum timer values."
  - "TaskRouter (#1861, part of #1667): create a TaskRouterWorkspace, a TaskRouterActivity, a TaskRouterTaskChannel, a TaskRouterTaskQueue, a TaskRouterWorkflow whose configuration routes to the queue (written with different spacing from what Twilio returns) and a TaskRouterWorker, refresh and preview show no change; changing each friendlyName updates in place, changing the workflow configuration updates in place, changing the activity available flag or the channel uniqueName replaces. Add the worker to a different activity in the program and confirm the worker moves; then move it in the console and confirm preview shows no drift for activitySid. Import each (<workspaceSid>, <workspaceSid>/<sid>) and the first preview plans no change. Not verified against a live account: that Twilio accepts the configuration document exactly as the provider sends it, and whether a worker created with no activitySid reports the workspace default activity."
  - "Verify extras (#1431 part 9): on a fresh VerifyService create a VerifyRateLimit with a bucket, a VerifyMessagingConfiguration for one country and a VerifyWebhook, refresh and preview show no change; changing the bucket max, the webhook url and eventTypes (in a different order) updates in place; removing webhook status and webhookVersion resets them to enabled and v2 and a re-preview is clean; import each (<serviceSid>/<sid>, <serviceSid>/<rateLimitSid>/<sid>, <serviceSid>/<country>) and the first preview plans no change. Add a number to the SafeList (the plus sign must be escaped as %2B in the path), read it back with getVerifySafeListNumber, destroy it. getVerifyTemplates lists the templates; use one SID as VerifyService.defaultTemplateSid. Not verified against a live account: that Twilio accepts the Version parameter name webhookVersion maps to, and the casing of the country in the response."
  - "Elastic SIP trunks: create a Trunk with recordingMode record-from-answer and recordingTrim trim-silence, refresh and preview show no change, getTrunk reports the same settings and the assigned domainName; changing recordingMode and friendlyName updates in place (no replacement); removing disasterRecoveryUrl clears it. Import a trunk, a TrunkOriginationUrl (<trunkSid>/<sid>) and an attachment (<trunkSid>/<listSid>): the first preview plans no change when the program states Twilio's defaults (transferMode disable-all, secure false, weight 10, priority 10, enabled true). Destroying an attachment must leave the credential list or IP access control list in place."
  - "EventSink: description updates in place (one POST), a changed destination, method, ARN or write key replaces; the Segment write key never appears in plaintext in the state. EventSubscription: with an active sink, adding, dropping and re-versioning a type changes only that type (no replacement), a type added in the Console shows up as drift on refresh, and a changed sinkSid replaces."
  - "ShortCode, ConnectApp and OutgoingCallerId only adopt: destroy must leave the short code, the Connect app and the verified caller ID in place and make no API call; a removed friendlyName, companyName, description, homepageUrl, authorizeRedirectUrl or permissions input must leave the value on Twilio; accountSid changes replace (Twilio cannot move these between accounts)."
  - "#1595 import adopts non-default flags and numbers: for Application, IncomingPhoneNumber, MessagingService and VerifyService create from a minimal program, import, preview shows no change; then set a non-default value out of band (stickySender false, codeLength 4, voiceCallerIdLookup true), import, and the value appears in the imported inputs. Also re-probe a freshly created resource per type and confirm the import-only default map in props.go (importBoolDefaults, importIntDefaults) matches it"
  - "#1577 import then inspect the stack state (pulumi stack export --show-secrets off): every property the schema marks secret on an imported resource is a secret, never plaintext; a refresh of a resource created by the program keeps them secret"
  - "Subaccount destroy of the provider's own top-level account must be refused, and import of it must fail."
  - "Preview must not fail when a validated input (friendlyName, ApiKey policy) is computed from another resource in the same stack."
  - "Removing a boolean or number input must only reset inputs with a documented default (validityPeriod to 36000, doNotShareWarningEnabled to false); every other removed flag stays untouched on Twilio."
  - "Removing an HTTP method input (voiceMethod, smsMethod, inboundMethod and the other *Method inputs) must send POST, not an empty string."
  - "Refresh must not echo inputs: the effective output shows what Twilio reports, and inputs the program leaves unset are never overwritten by server defaults."
  - "Application, IncomingPhoneNumber, ApiKey, Address, SigningKey, Queue and UsageTrigger in a subaccount must get the ID <accountSid>/<sid> and import must work for them."
  - "ApiKey in a subaccount must survive refresh and be deleted on destroy via the account-explicit route."
  - "A restricted ApiKey with the documented policy {\"allow\":[\"/twilio/iam/api-keys/create\"]} must create; a policy assertion Twilio rejects (error 70002, for example /v1/Services/**) must fail the create and leave no key with that friendlyName in the account's Keys list (Twilio creates the key before failing the call)."
  - "IncomingPhoneNumber.accountSid change must update in place, not replace."
  - "VerifyService totp, push, whatsapp and passkeys settings must round-trip: set on create, read back from the nested response objects (drift shows as a diff), and import adopts them."
  - "Removing a SID reference (IncomingPhoneNumber trunkSid or addressSid, VerifyService push credentials) must unassign it; removing apiVersion, voiceReceiveMode, emergencyStatus, usecase or defaultTemplateSid must leave the value untouched."
  - "ApiKey policy drift made in the console must show as a diff on refresh and be restored by the next update."
  - "ApiKey must be created without KeyType for standard keys."
  - "SigningKey secret is returned only on create and must stay in state (as a secret) across refreshes; it is empty after import."
  - "Address with autoCorrectAddress unset must not show a permanent diff when Twilio normalizes the street; with autoCorrectAddress false, drift in the address lines must show. isoCountry change must replace."
  - "UsageTrigger: only callbackUrl, callbackMethod and friendlyName update in place; triggerValue, usageCategory, recurring and triggerBy replace. A triggerValue given as an offset (+30) must not show a diff after refresh."
  - "Queue removing maxSize must reset it to 1000; a queue's live currentSize must not show as a diff."
  - "Video composition hook layout (#1937): create a VideoCompositionHook with a videoLayout that states only video_sources (for example {\"grid\":{\"video_sources\":[\"*\"]}}); refresh and the next preview show no change although Twilio reports its defaults for the region (cells_excluded, reuse show_oldest, x_pos, y_pos, z_pos 0, null height, width, max_rows, max_columns). Changing reuse or a position to a non-default value in the program is an in-place update, and a layout edited outside Pulumi to a non-default value shows as drift on refresh."
  - "Flex Flows (#1931, part of #1667): with a Chat service of the account create a FlexFlow with channelType custom, integrationType external, integrationUrl and a contactIdentity; refresh and preview show no change; changing friendlyName and integrationRetryCount updates in place. Read it with getFlexFlow and list it with getFlexFlows (friendlyName filter). A second FlexFlow with integrationType task (a TaskRouter workspace and workflow of the account) shows no change after a refresh when the program states only workspace and workflow. Import the SID and the first preview plans no change. Not verified against a live account: the default Twilio gives enabled and integrationCreationOnMessage (the provider never adopts them on import), whether Twilio accepts channelType custom without a Studio or Flex setup, whether the integration object is returned with only the keys of the chosen integrationType, and whether an update replaces the whole integration object (the provider always sends every integration input that is set)."
  - "Flex Plugins (#1931, part of #1667), on a Flex-enabled account: create a FlexPlugin with a uniqueName and friendlyName, then a FlexPluginVersion (pluginVersion 1.0.0 and a pluginUrl of a Twilio Asset or any https URL) and a FlexPluginConfiguration whose pluginVersionSids lists that version. Refresh and preview show no change; changing the plugin friendlyName updates in place; changing the version or the configuration replaces it. Read them with getFlexPlugin, getFlexPluginVersion(s) and getFlexPluginConfiguration(s) (pluginVersionSids). Import <pluginSid>/<versionSid> and the configuration SID and the first preview plans no change. Do not create a FlexPluginRelease on a shared account: it changes the plugins every Flex user loads and Twilio has no way to delete it. Not verified against a live account: the Plugins parameter encoding (one parameter per version, each the JSON object {\"plugin_version\": \"FV...\"}), whether a refresh of an archived object returns 404 or archived true (both read as deleted), whether the Configuration plugin list is returned in the order it was created, whether Twilio refuses to archive the released Configuration, and the default of private."
  - "BrandRegistration (#1928), manual: with approved Customer Profile and A2P Messaging Profile bundles create a BrandRegistration with mock true; refresh and preview show no change and status, tcrId and brandScore are filled in. Changing any input replaces it. Destroy removes it from state only: confirm in the console that the brand is still there. getBrandRegistration and getBrandRegistrations return it. Not verified against a live account: whether the mock brand reports brandType STANDARD when the input is omitted, the identityStatus values for a mock brand, and the shape of the errors entries."
  - "UsAppToPerson (#1928), manual, with an approved BrandRegistration and a Messaging Service you can spend on: create a campaign (use case LOW_VOLUME or 2FA, two message samples, a description of 40 or more characters); refresh and preview show no change while campaignStatus moves from IN_PROGRESS. Changing the description or the samples updates in place and the update succeeds without ageGated or directLending in the program. Changing the use case replaces it. Import <messagingServiceSid>/<sid> and the first preview plans no change. getUsAppToPersonUsecases with the brandRegistrationSid lists the use cases of that brand. Not verified against a live account: the shape of the use case entries (code, name, description, post_approval_required are taken from the spec text), whether an update that omits the opt-in and opt-out fields keeps them, whether a campaign can be deleted while its status is IN_PROGRESS, and the default of subscriberOptIn."
  - "TollfreeVerification (#1928), manual, with a toll-free number of the account and details of a real business: create a verification (2FA, a WEB_FORM opt-in image URL that Twilio can fetch); refresh and preview show no change while status moves from PENDING_REVIEW. After a rejection with editAllowed true, change businessWebsite and set editReason: the update succeeds and the status returns to PENDING_REVIEW; an edit when editAllowed is false fails. Changing the number replaces it. Import the SID and the first preview plans no change. getTollfreeVerifications with a status filter lists it. Not verified against a live account: how Twilio normalizes messageVolume and the phone and URL fields (a normalized value would show as drift), whether use_case_categories and opt_in_image_urls come back in the order sent, whether an edit may resend every field, and whether an approved verification can be deleted."
  - "Link shortening (#1928), manual, on an account with a link shortening domain set up by Twilio: adopt the domain with LinkShorteningDomainConfig (callbackUrl, continueOnFailure); refresh and preview show no change and an import of the domain SID plans no change. Upload a certificate with LinkShorteningDomainCertificate and a Messaging Service association with LinkShorteningMessagingServiceDomain; getLinkShorteningDomainDnsValidation and the other lookups return them. Replacing the tlsCert uploads again and certInValidation shows the pending validation. Destroy the association and the certificate; the domain configuration stays. Not verified against a live account: whether a new certificate needs the old one deleted first, whether Twilio answers a certificate read of a domain without one with 404, the default of continueOnFailure and disableHttps (the provider adopts what Twilio reports on import), and the shape of cert_in_validation."
notes: >-
  Never create a resource that sends an SMS or places a call; none of the shipped surface does, so no test is skipped. ApiKey returns its secret only on create. Subaccounts cannot be deleted, only closed, so use a unique friendlyName per run and expect leftovers. Cleanup order: MessagingServicePhoneNumber before MessagingService, and release nothing: IncomingPhoneNumber destroy never releases the number, it only drops it from state. Twilio is eventually consistent for new services and subaccounts, so retry reads briefly. MessagingServicePhoneNumber has no update (serviceSid and phoneNumberSid replace). The update properties are verified in the Go source as non-replace inputs; the API behaviour itself is unverified. Many products are deferred (A2P, Verify rate limits and others). Address delete fails while the address is in use. UsageTrigger fires a webhook, so point it at a url you control.
