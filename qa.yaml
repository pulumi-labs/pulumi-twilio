credentials:
  - name: TWILIO_ACCOUNT_SID
    required: true
  - one_of:
      - [TWILIO_AUTH_TOKEN]
      - [TWILIO_API_KEY, TWILIO_API_SECRET]
  - name: TWILIO_BASE_URL
    required: false
  - name: TWILIO_EDGE
    required: false
  - name: TWILIO_REGION
    required: false
account: >-
  A Twilio account (a trial or paid project is fine; a dedicated test project is preferred) with either TWILIO_AUTH_TOKEN or the TWILIO_API_KEY plus TWILIO_API_SECRET pair, whichever the provider config accepts (the exact precedence was not verified here). IncomingPhoneNumber and MessagingServicePhoneNumber need one phone number the account ALREADY owns, because the provider only adopts numbers and never buys them; that number must be bought by hand beforehand. Subaccount creation needs a paid (non-trial) project, which was not verified. Nothing was run against a live Twilio account.
resources:
  - type: twilio:index:Address
    test: true
    update: friendlyName
    cost: "none; needs a real, valid postal address (Twilio validates it, and emergencyEnabled only accepts true for a validated one). Delete fails while a number or bundle still uses the address"
  - type: twilio:index:ApiKey
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:Application
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:IncomingPhoneNumber
    test: true
    update: friendlyName
    cost: "none from this resource (it adopts an already-owned number and never purchases or releases it); the pre-owned number itself bills monthly"
  - type: twilio:index:MessagingService
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:MessagingServicePhoneNumber
    test: true
    update: null
    cost: none
  - type: twilio:index:Queue
    test: true
    update: maxSize
    cost: none
  - type: twilio:index:SigningKey
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:SipCredential
    test: true
    update: password
    cost: "none; needs a credential list (SipCredentialList). Twilio requires a password of 12 or more characters with a digit and mixed case. Twilio never returns the password: after an import the next preview plans an in-place password update, which is expected (not a defect); the import itself must not warn that inputs failed to validate"
  - type: twilio:index:ShortCode
    test: false
    update: friendlyName
    reason: needs a short code the account already leases, which Twilio provisions through support (weeks of carrier approval, a recurring monthly fee) and the REST API cannot create or release
  - type: twilio:index:ConnectApp
    test: false
    update: friendlyName
    reason: needs a Connect app created by hand in the Console (the REST API has no create call); the resource only adopts it
  - type: twilio:index:OutgoingCallerId
    test: false
    update: friendlyName
    reason: needs a number the account has already verified as a caller ID, which takes a verification call answered by a person; the resource only adopts it
  - type: twilio:index:EventSink
    test: true
    update: description
    cost: "none; a webhook sink to any reachable test URL. Twilio leaves it initialized until the URL answers the sink test"
  - type: twilio:index:EventSubscription
    test: false
    update: description
    reason: needs an active sink, and a webhook sink only becomes active after Twilio's test event is answered with the test ID (validate call), which the provider does not do; set it up by hand or use a Segment or Kinesis sink
  - type: twilio:index:Trunk
    test: true
    update: friendlyName
    cost: "none; Elastic SIP trunks are free until calls flow. domainName must be unique across Twilio and end in .pstn.twilio.com, so use a random suffix. Recording settings only take effect on calls"
  - type: twilio:index:TrunkOriginationUrl
    test: true
    update: weight
    cost: "none; a sip: URL such as sip:pbx.example.com is enough, no SIP endpoint has to answer. Twilio may reject a host that does not resolve (not verified); use a real SIP host if it does"
  - type: twilio:index:TrunkCredentialList
    test: true
    update: null
    cost: "none; attach a SipCredentialList created in the same program. Every input replaces, so there is no update field"
  - type: twilio:index:TrunkIpAccessControlList
    test: true
    update: null
    cost: "none; attach a SipIpAccessControlList created in the same program. Every input replaces, so there is no update field"
  - type: twilio:index:SipCredentialList
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:SipDomain
    test: true
    update: friendlyName
    cost: "none to create; the domainName is global across Twilio, so use a unique name ending in sip.twilio.com"
  - type: twilio:index:SipDomainCredentialListMapping
    test: true
    update: null
    cost: "none; needs a SipDomain and a SipCredentialList. Every input replaces; use authScope registrations to cover the second path"
  - type: twilio:index:SipDomainIpAccessControlListMapping
    test: true
    update: null
    cost: "none; needs a SipDomain and a SipIpAccessControlList. Every input replaces"
  - type: twilio:index:SipIpAccessControlList
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:SipIpAddress
    test: true
    update: friendlyName
    cost: "none; needs an access control list (SipIpAccessControlList) and an IPv4 address"
  - type: twilio:index:Subaccount
    test: true
    update: friendlyName
    cost: "none, but Twilio cannot delete subaccounts: destroy only closes them, and closed accounts linger for about 30 days"
  - type: twilio:index:UsageTrigger
    test: true
    update: friendlyName
    cost: "none to create, but the trigger calls its callbackUrl when usage crosses triggerValue: use a url you own and a value the account will not reach. Only callbackUrl, callbackMethod and friendlyName update in place"
  - type: twilio:index:VerifyService
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:VerifyRateLimit
    test: true
    update: description
    cost: none; create it on a VerifyService made in the same program. uniqueName replaces
  - type: twilio:index:VerifyRateLimitBucket
    test: true
    update: max
    cost: none; attach it to a VerifyRateLimit made in the same program
  - type: twilio:index:VerifyMessagingConfiguration
    test: true
    update: messagingServiceSid
    cost: none; needs a MessagingService made in the same program (two to test the update). The mocked tests do not prove that Twilio accepts a country the service already overrides, so use a fresh service
  - type: twilio:index:VerifyWebhook
    test: true
    update: friendlyName
    cost: none; the webhookUrl is only called when a factor or challenge event fires, which this test does not cause. Use a url you own
  - type: twilio:index:VerifySafeListNumber
    test: true
    update: null
    cost: none; use a number you own, and destroy it again (an entry exempts the number from Twilio's fraud guard). Twilio has no update call, so a change replaces it
  - type: twilio:index:ServerlessService
    test: true
    update: friendlyName
    cost: none; services are free until a function runs. uniqueName replaces, and deleting the service deletes everything in it
  - type: twilio:index:ServerlessEnvironment
    test: true
    update: null
    cost: none; create it on a ServerlessService made in the same program. Twilio has no update call, so every input replaces
  - type: twilio:index:ServerlessVariable
    test: true
    update: value
    cost: none; attach it to a ServerlessEnvironment made in the same program. Use a throwaway value, not a real credential
  - type: twilio:index:ServerlessFunction
    test: true
    update: friendlyName
    cost: none; this creates the container only, no code is uploaded
  - type: twilio:index:ServerlessAsset
    test: true
    update: friendlyName
    cost: none; this creates the container only, no file is uploaded
  - type: twilio:index:ConnectionPolicy
    test: true
    update: friendlyName
    cost: none; a policy is free until a BYOC trunk uses it
  - type: twilio:index:ConnectionPolicyTarget
    test: true
    update: priority
    cost: none; create it on a ConnectionPolicy made in the same program. Use a placeholder SIP host you control (a sip URI), no calls are placed
  - type: twilio:index:ByocTrunk
    test: true
    update: friendlyName
    cost: none; a trunk is free until calls flow through it. Point connectionPolicySid at a ConnectionPolicy made in the same program
  - type: twilio:index:IpRecord
    test: true
    update: friendlyName
    cost: none; use a documentation address such as 203.0.113.10. The address and prefix replace
  - type: twilio:index:SourceIpMapping
    test: true
    update: sipDomainSid
    cost: none; map an IpRecord made in the same program to a SipDomain made in the same program
  - type: twilio:index:VoiceRecordingConfiguration
    test: true
    update: description
    cost: none; a configuration is free until calls use it. Voice v2 is a new API (spec 0.0.1), so the account must have it enabled
  - type: twilio:index:VoiceTranscriptionConfiguration
    test: true
    update: description
    cost: none; a configuration is free until calls use it. Needs participantDefaults for channels 1 and 2 and a status callback or conversationConfigurationId
  - type: twilio:index:IncomingPhoneNumberAssignedAddOn
    test: false
    reason: needs a Marketplace add-on already installed in the account (installed from the Console or a purchase, the REST API cannot install one) and some add-ons bill per use
    cost: needs an add-on already installed in the account (installedAddOnSid, XE...) from the Marketplace, and a phone number the account owns; some add-ons bill per use. Not run automatically
functions:
  - name: getAccount
    test: true
  - name: getAddress
    test: true
  - name: getApiKey
    test: true
  - name: getApplication
    test: true
  - name: getBalance
    test: true
  - name: getIncomingPhoneNumber
    test: true
  - name: getMessagingService
    test: true
  - name: getMessagingServicePhoneNumber
    test: true
  - name: getQueue
    test: true
  - name: getSigningKey
    test: true
  - name: getShortCode
    test: false
    reason: needs a short code the account already leases
  - name: getConnectApp
    test: false
    reason: needs a Connect app created by hand in the Console
  - name: getOutgoingCallerId
    test: false
    reason: needs a number the account has already verified as a caller ID
  - name: getEventSink
    test: true
  - name: getEventSubscription
    test: false
    reason: needs a subscription, which needs an active sink
  - name: getTrunk
    test: true
  - name: getTrunkOriginationUrl
    test: true
  - name: getTrunkCredentialList
    test: true
  - name: getTrunkIpAccessControlList
    test: true
  - name: getSipCredential
    test: true
  - name: getSipCredentialList
    test: true
  - name: getSipDomain
    test: true
  - name: getSipDomainCredentialListMapping
    test: true
  - name: getSipDomainIpAccessControlListMapping
    test: true
  - name: getSipIpAccessControlList
    test: true
  - name: getSipIpAddress
    test: true
  - name: getSubaccount
    test: true
  - name: getUsageTrigger
    test: true
  - name: getVerifyService
    test: true
  - name: getVerifyRateLimit
    test: true
  - name: getVerifyRateLimitBucket
    test: true
  - name: getVerifyMessagingConfiguration
    test: true
  - name: getVerifyWebhook
    test: true
  - name: getVerifySafeListNumber
    test: true
  - name: getVerifyTemplates
    test: true
  - name: getServerlessService
    test: true
  - name: getServerlessEnvironment
    test: true
  - name: getServerlessVariable
    test: true
  - name: getServerlessFunction
    test: true
  - name: getServerlessAsset
    test: true
  - name: getByocTrunk
    test: true
  - name: getVoiceRecordingConfiguration
    test: true
  - name: getVoiceTranscriptionConfiguration
    test: true
  - name: getConnectionPolicy
    test: true
  - name: getConnectionPolicyTarget
    test: true
  - name: getIpRecord
    test: true
  - name: getSourceIpMapping
    test: true
  - name: getIncomingPhoneNumberAssignedAddOn
    test: false
    reason: needs a Marketplace add-on already installed and assigned to a number, which the REST API cannot set up
  - name: getAvailablePhoneNumbers
    test: true
  - name: getUsageRecords
    test: true
  - name: getAuthorizedConnectApps
    test: true
  - name: getAuthorizedConnectApp
    test: true
  - name: getEventTypes
    test: true
