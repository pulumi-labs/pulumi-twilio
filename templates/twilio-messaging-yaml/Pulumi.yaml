name: ${PROJECT}
description: ${DESCRIPTION}
runtime: yaml

template:
  description: A YAML program that provisions a Twilio TwiML application and a messaging service.
  config:
    twilio:accountSid:
      description: Twilio account SID (starts with AC), from the Twilio Console. Or set TWILIO_ACCOUNT_SID.
    twilio:authToken:
      description: Twilio account auth token. Or set TWILIO_AUTH_TOKEN.
      secret: true

config:
  voiceUrl:
    type: string
    default: https://example.com/webhooks/voice
  smsUrl:
    type: string
    default: https://example.com/webhooks/sms

resources:
  app:
    type: twilio:index:Application
    properties:
      friendlyName: pulumi-messaging
      voiceUrl: ${voiceUrl}
      voiceMethod: POST
      smsUrl: ${smsUrl}
      smsMethod: POST
  svc:
    type: twilio:index:MessagingService
    properties:
      friendlyName: pulumi-alerts
      inboundRequestUrl: ${smsUrl}
      inboundMethod: POST
      stickySender: true

outputs:
  applicationSid: ${app.sid}
  messagingServiceSid: ${svc.sid}
