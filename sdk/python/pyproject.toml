[project]
  name = "pulumi_labs_twilio"
  description = "Experimental: manage Twilio subaccounts, API keys, phone-number webhooks, TwiML applications, addresses, signing keys, call queues, usage triggers, SIP credential lists, IP access control lists and domains, short codes, Connect apps, verified caller IDs, Event Streams sinks and subscriptions, messaging services and Verify services as infrastructure with Pulumi."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "twilio", "communications", "sms", "voice", "category/network"]
  readme = "pulumi_labs_twilio/README.md"
  requires-python = ">=3.9"
  version = "0.0.1+dev"
  license = "Apache-2.0"
  [project.urls]
    Homepage = "https://www.twilio.com"
    Repository = "https://github.com/pulumi-labs/pulumi-twilio"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_labs_twilio = ["py.typed", "pulumi-plugin.json"]
