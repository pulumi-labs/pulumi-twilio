    test: true
regressions:
  - "Voice v2 configurations (#1666): create a VoiceTranscriptionConfiguration (engine deepgram, model nova-3, language en-US, participantDefaults for channels 1 and 2, a status callback url) and a VoiceRecordingConfiguration whose features entry references its configurationId, with a compositionPolicy and a call status callback; refresh and preview show no change, also when the program omits the callback methods. Change the descriptions, the language and a callback url (PUT, same ID), remove a feature or the policy and check what Twilio keeps. Import each by ID and the first preview plans no change; getVoiceRecordingConfiguration and getVoiceTranscriptionConfiguration take the ID or the unique name. Not verified against a live account (the Voice v2 definition is version 0.0.1): whether PUT replaces or merges (the provider sends the whole configuration and leaves unset fields out), whether Twilio defaults a callback method to POST or adds other defaults on read, whether uniqueName can change, and the exact rules for participantDefaults (the provider leaves them to Twilio)."
  - "#1715 pulumi import of an ID that does not exist (for example twilio:index:ShortCode s SC00000000000000000000000000000001, Address, ApiKey, Application, Queue, Subaccount) fails with 'does not exist' and leaves nothing in state; a refresh of a resource deleted outside Pulumi still drops it from state"
  - "#1716 import a ServerlessEnvironment created with domainSuffix stg (pulumi import twilio:index:ServerlessEnvironment e <serviceSid>/ZE...), then pulumi preview --expect-no-changes against the program that created it: no replace of the environment or its variables, and the imported inputs carry domainSuffix; an environment created without a suffix imports without one; stating a different suffix still plans a replace"
  - "#1717 on a VerifyService with no configuration for FR: getVerifyMessagingConfiguration (FR) fails with was not found and pulumi import twilio:index:VerifyMessagingConfiguration m <serviceSid>/FR fails instead of storing an empty resource; after pulumi destroy of a created DE configuration the lookup for DE fails and a refresh of a stack that still lists it drops it from state"
  - "#1680 import a SipDomain created with sipRegistration: true, then pulumi preview --expect-no-changes against the same program: no update; a SipDomain created without it imports without sipRegistration and previews clean"
  - "#1681 import a VerifyService created with totpCodeLength 7, totpSkew 2, totpTimeStep 20: the imported inputs contain all three and preview --expect-no-changes is clean; a service on the defaults (6, 1, 30) imports none of them"
  - "#1679 import a UsageTrigger (pulumi import twilio:index:UsageTrigger t UT...), then pulumi preview --expect-no-changes against the program that created it (no triggerBy, and again with callbackMethod: POST): no replace and no update; setting triggerBy to a different value still plans a replace"
  - "Assigned add-ons (#1431 part 13): with an add-on installed from the Marketplace, assign it to an owned number with IncomingPhoneNumberAssignedAddOn (phoneNumberSid, installedAddOnSid); refresh and preview show no change, and getIncomingPhoneNumberAssignedAddOn returns its friendlyName, configuration and extensions. Changing installedAddOnSid replaces it (Twilio has no update). Import <phoneNumberSid>/<sid>: the first preview plans only an in-place update of installedAddOnSid that calls no API (Twilio never returns it), and a later change of it replaces. Destroy unassigns it; destroying twice is a no-op. Not verified against a live account: whether the assignment SID equals the installed add-on SID and what Twilio answers when the same add-on is assigned twice."
  - "Lookups (#1431 part 12): getAvailablePhoneNumbers for US local returns numbers whose phoneNumber is E.164 and whose capabilities match the smsEnabled and voiceEnabled filters, numberType tollFree and mobile hit their own paths, and limit caps the list; nothing is purchased. getUsageRecords for allTime and thisMonth returns the same categories as the console, price stays a decimal string; getAuthorizedConnectApps lists the apps shown under Authorized Connect Apps; getEventTypes lists the types the console offers for a subscription and getEventSchema reports the latest version. A schemaId that does not exist must fail with 'was not found'."
  - "BYOC (#1431 part 11): create a ConnectionPolicy with two ConnectionPolicyTargets (different priority and weight), a ByocTrunk with connectionPolicySid pointing at the policy, an IpRecord and a SourceIpMapping to a SipDomain; refresh and preview show no change. Changing the trunk friendlyName and voiceMethod, a target priority, weight and enabled flag, the record friendlyName and the mapping sipDomainSid updates in place (no replacement); changing a record ipAddress or cidrPrefixLength, a target connectionPolicySid or a mapping ipRecordSid replaces. Removing the trunk voiceUrl or connectionPolicySid clears it. Import each (SID, or <connectionPolicySid>/<sid> for a target) and the first preview plans no change, also when the program states priority 10, weight 10, enabled true or cidrPrefixLength 32. Destroying a policy removes its targets. Not verified against a live account: whether Twilio accepts an empty ConnectionPolicySid or FromDomainSid to detach, and whether it normalizes ipAddress."
  - "Serverless (#1431 part 10): create a ServerlessService, a ServerlessEnvironment with a domainSuffix, a ServerlessVariable, a ServerlessFunction and a ServerlessAsset; refresh and preview show no change. Changing the service friendlyName, the variable key and value, and the function friendlyName updates in place (no replacement); changing the environment domainSuffix or uniqueName replaces it. The variable value never appears in plaintext in the state. Import each (<serviceSid>, <serviceSid>/<sid>, <serviceSid>/<environmentSid>/<sid>) and the first preview plans no change, also when the program omits includeCredentials and uiEditable. Destroying the service removes the children and destroying a child afterwards is a no-op. Not verified against a live account: the defaults of includeCredentials and uiEditable, the limit of 16 characters on domainSuffix and whether Twilio returns the variable value on read."
  - "Verify extras (#1431 part 9): on a fresh VerifyService create a VerifyRateLimit with a bucket, a VerifyMessagingConfiguration for one country and a VerifyWebhook, refresh and preview show no change; changing the bucket max, the webhook url and eventTypes (in a different order) updates in place; removing webhook status and webhookVersion resets them to enabled and v2 and a re-preview is clean; import each (<serviceSid>/<sid>, <serviceSid>/<rateLimitSid>/<sid>, <serviceSid>/<country>) and the first preview plans no change. Add a number to the SafeList (the plus sign must be escaped as %2B in the path), read it back with getVerifySafeListNumber, destroy it. getVerifyTemplates lists the templates; use one SID as VerifyService.defaultTemplateSid. Not verified against a live account: that Twilio accepts the Version parameter name webhookVersion maps to, and the casing of the country in the response."
  - "Elastic SIP trunks: create a Trunk with recordingMode record-from-answer and recordingTrim trim-silence, refresh and preview show no change, getTrunk reports the same settings and the assigned domainName; changing recordingMode and friendlyName updates in place (no replacement); removing disasterRecoveryUrl clears it. Import a trunk, a TrunkOriginationUrl (<trunkSid>/<sid>) and an attachment (<trunkSid>/<listSid>): the first preview plans no change when the program states Twilio's defaults (transferMode disable-all, secure false, weight 10, priority 10, enabled true). Destroying an attachment must leave the credential list or IP access control list in place."
  - "EventSink: description updates in place (one POST), a changed destination, method, ARN or write key replaces; the Segment write key never appears in plaintext in the state. EventSubscription: with an active sink, adding, dropping and re-versioning a type changes only that type (no replacement), a type added in the Console shows up as drift on refresh, and a changed sinkSid replaces."
  - "ShortCode, ConnectApp and OutgoingCallerId only adopt: destroy must leave the short code, the Connect app and the verified caller ID in place and make no API call; a removed friendlyName, companyName, description, homepageUrl, authorizeRedirectUrl or permissions input must leave the value on Twilio; accountSid changes replace (Twilio cannot move these between accounts)."
  - "#1595 import adopts non-default flags and numbers: for Application, IncomingPhoneNumber, MessagingService and VerifyService create from a minimal program, import, preview shows no change; then set a non-default value out of band (stickySender false, codeLength 4, voiceCallerIdLookup true), import, and the value appears in the imported inputs. Also re-probe a freshly created resource per type and confirm the import-only default map in props.go (importBoolDefaults, importIntDefaults) matches it"
  - "#1577 import then inspect the stack state (pulumi stack export --show-secrets off): every property the schema marks secret on an imported resource is a secret, never plaintext; a refresh of a resource created by the program keeps them secret"
  - "Subaccount destroy of the provider's own top-level account must be refused, and import of it must fail."
  - "Preview must not fail when a validated input (friendlyName, ApiKey policy) is computed from another resource in the same stack."
  - "Removing a boolean or number input must only reset inputs with a documented default (validityPeriod to 36000, doNotShareWarningEnabled to false); every other removed flag stays untouched on Twilio."
  - "Removing an HTTP method input (voiceMethod, smsMethod, inboundMethod and the other *Method inputs) must send POST, not an empty string."
  - "Refresh must not echo inputs: the effective output shows what Twilio reports, and inputs the program leaves unset are never overwritten by server defaults."
  - "Application, IncomingPhoneNumber, ApiKey, Address, SigningKey, Queue and UsageTrigger in a subaccount must get the ID <accountSid>/<sid> and import must work for them."
  - "ApiKey in a subaccount must survive refresh and be deleted on destroy via the account-explicit route."
  - "A restricted ApiKey with the documented policy {\"allow\":[\"/twilio/iam/api-keys/create\"]} must create; a policy assertion Twilio rejects (error 70002, for example /v1/Services/**) must fail the create and leave no key with that friendlyName in the account's Keys list (Twilio creates the key before failing the call)."
  - "IncomingPhoneNumber.accountSid change must update in place, not replace."
  - "VerifyService totp, push, whatsapp and passkeys settings must round-trip: set on create, read back from the nested response objects (drift shows as a diff), and import adopts them."
  - "Removing a SID reference (IncomingPhoneNumber trunkSid or addressSid, VerifyService push credentials) must unassign it; removing apiVersion, voiceReceiveMode, emergencyStatus, usecase or defaultTemplateSid must leave the value untouched."
  - "ApiKey policy drift made in the console must show as a diff on refresh and be restored by the next update."
  - "ApiKey must be created without KeyType for standard keys."
  - "SigningKey secret is returned only on create and must stay in state (as a secret) across refreshes; it is empty after import."
  - "Address with autoCorrectAddress unset must not show a permanent diff when Twilio normalizes the street; with autoCorrectAddress false, drift in the address lines must show. isoCountry change must replace."
  - "UsageTrigger: only callbackUrl, callbackMethod and friendlyName update in place; triggerValue, usageCategory, recurring and triggerBy replace. A triggerValue given as an offset (+30) must not show a diff after refresh."
  - "Queue removing maxSize must reset it to 1000; a queue's live currentSize must not show as a diff."
notes: >-
  Never create a resource that sends an SMS or places a call; none of the shipped surface does, so no test is skipped. ApiKey returns its secret only on create. Subaccounts cannot be deleted, only closed, so use a unique friendlyName per run and expect leftovers. Cleanup order: MessagingServicePhoneNumber before MessagingService, and release nothing: IncomingPhoneNumber destroy never releases the number, it only drops it from state. Twilio is eventually consistent for new services and subaccounts, so retry reads briefly. MessagingServicePhoneNumber has no update (serviceSid and phoneNumberSid replace). The update properties are verified in the Go source as non-replace inputs; the API behaviour itself is unverified. Many products are deferred (A2P, Verify rate limits and others). Address delete fails while the address is in use. UsageTrigger fires a webhook, so point it at a url you control.
