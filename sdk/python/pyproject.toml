[project]
  name = "pulumi_labs_twilio"
  description = "Experimental: manage Twilio as infrastructure with Pulumi: subaccounts, API keys, phone-number webhooks, TwiML applications, messaging and Verify services, SIP trunking and BYOC, Event Streams, Serverless services and more."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "twilio", "communications", "sms", "voice", "category/network"]
  readme = "pulumi_labs_twilio/README.md"
  requires-python = ">=3.9"
  version = "0.0.1+dev"
  license = "Apache-2.0"
  [project.urls]
    Homepage = "https://www.twilio.com"
    Repository = "https://github.com/pulumi-labs/pulumi-twilio"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_labs_twilio = ["py.typed", "pulumi-plugin.json"]
