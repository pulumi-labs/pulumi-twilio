name: ${PROJECT}
runtime: java
description: ${DESCRIPTION}

template:
  description: A Java program that provisions a Twilio TwiML application and a messaging service.
  config:
    twilio:accountSid:
      description: Twilio account SID (starts with AC), from the Twilio Console. Or set TWILIO_ACCOUNT_SID.
    twilio:authToken:
      description: Twilio account auth token. Or set TWILIO_AUTH_TOKEN.
      secret: true
