name: twilio-messaging-yaml
description: Route SMS and voice webhooks with a Twilio application and messaging service (YAML)
runtime: yaml

# Credentials come from config (`pulumi config set twilio:accountSid ...` and `pulumi config set --secret twilio:authToken ...`) or the TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN environment variables.
config:
  smsUrl:
    type: string
    default: https://example.com/webhooks/sms
  voiceUrl:
    type: string
    default: https://example.com/webhooks/voice

resources:
  app:
    type: twilio:index:Application
    properties:
      friendlyName: pulumi-messaging
      voiceUrl: ${voiceUrl}
      voiceMethod: POST
      smsUrl: ${smsUrl}
      smsMethod: POST

  svc:
    type: twilio:index:MessagingService
    properties:
      friendlyName: pulumi-alerts
      inboundRequestUrl: ${smsUrl}
      inboundMethod: POST
      stickySender: true

  # YAML cannot branch on whether a config value is set. To attach a number the account
  # already owns, add a `phoneNumber` config entry and uncomment the two resources below.
  # Adopts a number the account already owns: this never purchases a number, and destroying the stack does not release it.
  #
  # number:
  #   type: twilio:index:IncomingPhoneNumber
  #   properties:
  #     phoneNumber: ${phoneNumber}
  #     voiceApplicationSid: ${app.sid}
  #
  # sender:
  #   type: twilio:index:MessagingServicePhoneNumber
  #   properties:
  #     serviceSid: ${svc.sid}
  #     phoneNumberSid: ${number.sid}

outputs:
  applicationSid: ${app.sid}
  messagingServiceSid: ${svc.sid}
  # numberSid: ${number.sid}
