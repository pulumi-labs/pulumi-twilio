credentials:
  - name: TWILIO_ACCOUNT_SID
    required: true
  - one_of:
      - [TWILIO_AUTH_TOKEN]
      - [TWILIO_API_KEY, TWILIO_API_SECRET]
  - name: TWILIO_BASE_URL
    required: false
  - name: TWILIO_EDGE
    required: false
  - name: TWILIO_REGION
    required: false
account: >-
  A Twilio account (a trial or paid project is fine; a dedicated test project is preferred) with either TWILIO_AUTH_TOKEN or the TWILIO_API_KEY plus TWILIO_API_SECRET pair, whichever the provider config accepts (the exact precedence was not verified here). IncomingPhoneNumber and MessagingServicePhoneNumber need one phone number the account ALREADY owns, because the provider only adopts numbers and never buys them; that number must be bought by hand beforehand. Subaccount creation needs a paid (non-trial) project, which was not verified. Nothing was run against a live Twilio account.
resources:
  - type: twilio:index:Address
    test: true
    update: friendlyName
    cost: "none; needs a real, valid postal address (Twilio validates it, and emergencyEnabled only accepts true for a validated one). Delete fails while a number or bundle still uses the address"
  - type: twilio:index:ApiKey
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:Application
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:IncomingPhoneNumber
    test: true
    update: friendlyName
    cost: "none from this resource (it adopts an already-owned number and never purchases or releases it); the pre-owned number itself bills monthly"
  - type: twilio:index:MessagingService
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:MessagingServicePhoneNumber
    test: true
    update: null
    cost: none
  - type: twilio:index:MessagingServiceShortCode
    test: false
    reason: it needs a short code of the account, which is leased from the carriers and cannot be created by a test
    cost: none for the entry; destroy removes the short code from the pool and keeps it
  - type: twilio:index:MessagingServiceChannelSender
    test: false
    reason: it needs a channel sender (for example a registered WhatsApp sender) of the account, which needs a Meta business registration
    cost: none for the entry; destroy removes the sender from the pool and keeps it
  - type: twilio:index:MessagingServiceAlphaSender
    test: true
    update: null
    cost: none; the sender ID is not used until a message is sent. Twilio has no update call, so a change replaces it
  - type: twilio:index:MessagingServiceDestinationAlphaSender
    test: true
    update: null
    cost: none; leave isoCountryCode out for a default sender ID. Twilio has no update call, so a change replaces it
  - type: twilio:index:Queue
    test: true
    update: maxSize
    cost: none
  - type: twilio:index:SigningKey
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:SipCredential
    test: true
    update: password
    cost: "none; needs a credential list (SipCredentialList). Twilio requires a password of 12 or more characters with a digit and mixed case. Twilio never returns the password: after an import the next preview plans an in-place password update, which is expected (not a defect); the import itself must not warn that inputs failed to validate"
  - type: twilio:index:ShortCode
    test: false
    update: friendlyName
    reason: needs a short code the account already leases, which Twilio provisions through support (weeks of carrier approval, a recurring monthly fee) and the REST API cannot create or release
  - type: twilio:index:ConnectApp
    test: false
    update: friendlyName
    reason: needs a Connect app created by hand in the Console (the REST API has no create call); the resource only adopts it
  - type: twilio:index:OutgoingCallerId
    test: false
    update: friendlyName
    reason: needs a number the account has already verified as a caller ID, which takes a verification call answered by a person; the resource only adopts it
  - type: twilio:index:EventSink
    test: true
    update: description
    cost: "none; a webhook sink to any reachable test URL. Twilio leaves it initialized until the URL answers the sink test"
  - type: twilio:index:EventSubscription
    test: false
    update: description
    reason: needs an active sink, and a webhook sink only becomes active after Twilio's test event is answered with the test ID (validate call), which the provider does not do; set it up by hand or use a Segment or Kinesis sink
  - type: twilio:index:Trunk
    test: true
    update: friendlyName
    cost: "none; Elastic SIP trunks are free until calls flow. domainName must be unique across Twilio and end in .pstn.twilio.com, so use a random suffix. Recording settings only take effect on calls"
  - type: twilio:index:TrunkOriginationUrl
    test: true
    update: weight
    cost: "none; a sip: URL such as sip:pbx.example.com is enough, no SIP endpoint has to answer. Twilio may reject a host that does not resolve (not verified); use a real SIP host if it does"
  - type: twilio:index:TrunkCredentialList
    test: true
    update: null
    cost: "none; attach a SipCredentialList created in the same program. Every input replaces, so there is no update field"
  - type: twilio:index:TrunkIpAccessControlList
    test: true
    update: null
    cost: "none; attach a SipIpAccessControlList created in the same program. Every input replaces, so there is no update field"
  - type: twilio:index:SipCredentialList
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:SipDomain
    test: true
    update: friendlyName
    cost: "none to create; the domainName is global across Twilio, so use a unique name ending in sip.twilio.com"
  - type: twilio:index:SipDomainCredentialListMapping
    test: true
    update: null
    cost: "none; needs a SipDomain and a SipCredentialList. Every input replaces; use authScope registrations to cover the second path"
  - type: twilio:index:SipDomainIpAccessControlListMapping
    test: true
    update: null
    cost: "none; needs a SipDomain and a SipIpAccessControlList. Every input replaces"
  - type: twilio:index:SipIpAccessControlList
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:SipIpAddress
    test: true
    update: friendlyName
    cost: "none; needs an access control list (SipIpAccessControlList) and an IPv4 address"
  - type: twilio:index:Subaccount
    test: true
    update: friendlyName
    cost: "none, but Twilio cannot delete subaccounts: destroy only closes them, and closed accounts linger for about 30 days"
  - type: twilio:index:UsageTrigger
    test: true
    update: friendlyName
    cost: "none to create, but the trigger calls its callbackUrl when usage crosses triggerValue: use a url you own and a value the account will not reach. Only callbackUrl, callbackMethod and friendlyName update in place"
  - type: twilio:index:VerifyService
    test: true
    update: friendlyName
    cost: none
  - type: twilio:index:VerifyRateLimit
    test: true
    update: description
    cost: none; create it on a VerifyService made in the same program. uniqueName replaces
  - type: twilio:index:VerifyRateLimitBucket
    test: true
    update: max
    cost: none; attach it to a VerifyRateLimit made in the same program
  - type: twilio:index:VerifyMessagingConfiguration
    test: true
    update: messagingServiceSid
    cost: none; needs a MessagingService made in the same program (two to test the update). The mocked tests do not prove that Twilio accepts a country the service already overrides, so use a fresh service
  - type: twilio:index:VerifyWebhook
    test: true
    update: friendlyName
    cost: none; the webhookUrl is only called when a factor or challenge event fires, which this test does not cause. Use a url you own
  - type: twilio:index:VerifySafeListNumber
    test: true
    update: null
    cost: none; use a number you own, and destroy it again (an entry exempts the number from Twilio's fraud guard). Twilio has no update call, so a change replaces it
  - type: twilio:index:ServerlessService
    test: true
    update: friendlyName
    cost: none; services are free until a function runs. uniqueName replaces, and deleting the service deletes everything in it
  - type: twilio:index:ServerlessEnvironment
    test: true
    update: null
    cost: none; create it on a ServerlessService made in the same program. Twilio has no update call, so every input replaces
  - type: twilio:index:ServerlessVariable
    test: true
    update: value
    cost: none; attach it to a ServerlessEnvironment made in the same program. Use a throwaway value, not a real credential
  - type: twilio:index:ServerlessFunction
    test: true
    update: friendlyName
    cost: none; this creates the container only, no code is uploaded
  - type: twilio:index:ServerlessAsset
    test: true
    update: friendlyName
    cost: none; this creates the container only, no file is uploaded
  - type: twilio:index:ServerlessFunctionVersion
    test: true
    update: null
    cost: none; upload a one-line handler to a ServerlessFunction made in the same program. Every input replaces the version (immutable); Twilio has no delete for versions, so destroy only forgets it. The upload host request shape is unverified against a live account
  - type: twilio:index:ServerlessAssetVersion
    test: true
    update: null
    cost: none; upload a small text asset (content) and, separately, a few bytes as contentBase64. Every input replaces the version; destroy only forgets it
  - type: twilio:index:ServerlessBuild
    test: true
    update: null
    cost: none; build from the versions above (runtime node20, one small dependency such as twilio). Create waits until the build completes, which takes a minute or more. Every input replaces; delete is a real DELETE
  - type: twilio:index:ServerlessDeployment
    test: true
    update: null
    cost: none; deploy the build to the ServerlessEnvironment of the same program. Every input replaces. Twilio has no delete for deployments, so destroy only forgets it and the environment keeps serving the build until the service is destroyed
  - type: twilio:index:ConnectionPolicy
    test: true
    update: friendlyName
    cost: none; a policy is free until a BYOC trunk uses it
  - type: twilio:index:ConnectionPolicyTarget
    test: true
    update: priority
    cost: none; create it on a ConnectionPolicy made in the same program. Use a placeholder SIP host you control (a sip URI), no calls are placed
  - type: twilio:index:ByocTrunk
    test: true
    update: friendlyName
    cost: none; a trunk is free until calls flow through it. Point connectionPolicySid at a ConnectionPolicy made in the same program
  - type: twilio:index:IpRecord
    test: true
    update: friendlyName
    cost: none; use a documentation address such as 203.0.113.10. The address and prefix replace
  - type: twilio:index:SourceIpMapping
    test: true
    update: sipDomainSid
    cost: none; map an IpRecord made in the same program to a SipDomain made in the same program
  - type: twilio:index:VoiceAccountDefaultRecordingConfiguration
    test: false
    reason: A singleton that sets how every call on the account without a recording configuration of its own is recorded, so a test run changes the real account behaviour and create replaces an existing account default that cannot be restored on destroy. Exercise manually on a throwaway account.
  - type: twilio:index:VoiceDefaultRecordingConfiguration
    test: false
    reason: A singleton that selects which recording configuration applies to every call on the account without one of its own, so a test run changes real account behaviour, and Twilio documents no call that unsets it, so destroy cannot restore the previous default. Exercise manually on a throwaway account.
  - type: twilio:index:VoiceDefaultTranscriptionConfiguration
    test: false
    reason: A singleton that selects which transcription configuration applies to every call on the account without one of its own, so a test run changes real account behaviour, and Twilio documents no call that unsets it, so destroy cannot restore the previous default. Exercise manually on a throwaway account.
  - type: twilio:index:VoiceRecordingConfiguration
    test: true
    update: description
    cost: none; a configuration is free until calls use it. Voice v2 is a new API (spec 0.0.1), so the account must have it enabled
  - type: twilio:index:RoutesPhoneNumber
    test: false
    reason: Sets the inbound processing region of an existing phone number, so a test run changes where real traffic is processed, and Twilio documents no call that removes the setting, so destroy cannot restore the previous region. Needs an existing phone number. Exercise manually on a throwaway account with a phone number you can spare.
  - type: twilio:index:RoutesShortCode
    test: false
    reason: Sets the inbound processing region of an existing short code, so a test run changes where real traffic is processed, and Twilio documents no call that removes the setting, so destroy cannot restore the previous region. Needs an existing short code. Exercise manually on a throwaway account with a short code you can spare.
  - type: twilio:index:RoutesSipDomain
    test: false
    reason: Sets the inbound processing region of an existing SIP domain, so a test run changes where real traffic is processed, and Twilio documents no call that removes the setting, so destroy cannot restore the previous region. Needs an existing SIP domain. Exercise manually on a throwaway account with a SIP domain you can spare.
  - type: twilio:index:RoutesTrunk
    test: false
    reason: Sets the inbound processing region of an existing SIP trunk domain, so a test run changes where real traffic is processed, and Twilio documents no call that removes the setting, so destroy cannot restore the previous region. Needs an existing SIP trunk domain. Exercise manually on a throwaway account with a SIP trunk domain you can spare.
  - type: twilio:index:VoiceTranscriptionConfiguration
    test: true
    update: description
    cost: none; a configuration is free until calls use it. Needs participantDefaults for channels 1 and 2 and a status callback or conversationConfigurationId
  - type: twilio:index:IncomingPhoneNumberAssignedAddOn
    test: false
    reason: needs a Marketplace add-on already installed in the account (installed from the Console or a purchase, the REST API cannot install one) and some add-ons bill per use
    cost: needs an add-on already installed in the account (installedAddOnSid, XE...) from the Marketplace, and a phone number the account owns; some add-ons bill per use. Not run automatically
  - type: twilio:index:TaskRouterWorkspace
    test: true
    update: friendlyName
    cost: none; TaskRouter configuration is free. Destroying the workspace deletes everything in it
  - type: twilio:index:TaskRouterActivity
    test: true
    update: friendlyName
    cost: none; create it on a TaskRouterWorkspace made in the same program. available replaces
  - type: twilio:index:TaskRouterTaskChannel
    test: true
    update: friendlyName
    cost: none; create it on a TaskRouterWorkspace made in the same program. uniqueName replaces
  - type: twilio:index:TaskRouterTaskQueue
    test: true
    update: friendlyName
    cost: none; create it on a TaskRouterWorkspace made in the same program
  - type: twilio:index:TaskRouterWorkflow
    test: true
    update: friendlyName
    cost: none; its configuration must name a TaskRouterTaskQueue of the same workspace
  - type: twilio:index:TaskRouterWorker
    test: true
    update: friendlyName
    cost: none; create it on a TaskRouterWorkspace made in the same program
  - type: twilio:index:ConversationsService
    test: true
    update: null
    cost: none; Conversations configuration is free. friendlyName cannot be updated, so changing it replaces the service
  - type: twilio:index:ConversationsServiceConfiguration
    test: true
    update: reachabilityEnabled
    cost: none; create it on a ConversationsService made in the same program. Destroy forgets it
  - type: twilio:index:ConversationsRole
    test: true
    update: permissions
    cost: none; with chatServiceSid it belongs to a ConversationsService of the same program. Permissions update in place
  - type: twilio:index:ConversationsCredential
    test: false
    reason: needs a real push credential (an APNs certificate and key, a GCM API key or an FCM server key); Twilio validates the APNs certificate
    cost: none once you have the push credential. Not run automatically
  - type: twilio:index:ConversationsAddressConfiguration
    test: true
    update: friendlyName
    cost: none for an sms address (a phone number the account owns); auto-creation does not send anything by itself
  - type: twilio:index:ConversationsWebhookConfiguration
    test: false
    reason: the account-level configuration is a single object shared with everything else in the account and has no delete, so a test would leave the account changed
    cost: none; with chatServiceSid it configures one ConversationsService. Destroy forgets it
  - type: twilio:index:ConversationsServiceNotificationConfiguration
    test: true
    update: logEnabled
    cost: none; create it on a ConversationsService made in the same program. Destroy forgets it
  - type: twilio:index:ConversationsConfiguration
    test: false
    reason: the account-level defaults are a single object shared with everything else in the account and have no delete, so a test would leave the account changed
    cost: none. Destroy forgets it
  - type: twilio:index:SyncService
    test: true
    update: friendlyName
    cost: none; a Sync service is free until it is used. Destroy deletes it
  - type: twilio:index:NotifyService
    test: true
    update: friendlyName
    cost: none; a Notify service is free until it sends. Destroy deletes it
  - type: twilio:index:NotifyCredential
    test: false
    reason: a credential needs a real APNs certificate and key or a Firebase server key from the account owner, and Twilio validates it when it is created
    cost: none; destroy deletes it
  - type: twilio:index:IntelligenceService
    test: true
    update: friendlyName
    cost: none; a Voice Intelligence service is free until it transcribes. Destroy deletes it
  - type: twilio:index:IntelligenceCustomOperator
    test: false
    reason: the config must follow the schema of a real operator type of the account, which the account owner has to supply
    cost: none; destroy deletes it
  - type: twilio:index:ProxyService
    test: true
    update: uniqueName
    cost: none; a Proxy service is free until a session runs. Destroy deletes it
  - type: twilio:index:ContentTemplate
    test: true
    update: friendlyName
    cost: none; a Content template is free to create and store. Destroy deletes it
  - type: twilio:index:ProxyPhoneNumber
    test: false
    reason: it needs a phone number of the account, which is billed and has to be supplied by the account owner, and Proxy allows a number in only one service
    cost: none for the entry; the number is billed as usual. Destroy removes it from the pool and keeps the number
  - type: twilio:index:AwsCredential
    test: false
    reason: it needs real AWS access keys of the account owner, which Twilio may validate when they are stored
    cost: none. Destroy deletes it
  - type: twilio:index:PublicKeyCredential
    test: true
    update: friendlyName
    cost: none; generate a throwaway RSA public key (openssl rsa -pubout). Destroy deletes it
  - type: twilio:index:AccountSafeListNumber
    test: true
    update: null
    cost: none; use a number you own and destroy it again (an entry exempts the number from Twilio's SMS fraud blocks). Twilio has no update call, so a change replaces it
  - type: twilio:index:OAuthApp
    test: true
    update: null
    cost: none; an OAuth app is free. Twilio has no read or update call, so every input replaces the app, a refresh keeps the stored state and an import fails by design. The client secret is returned only on create
  - type: twilio:index:VideoCompositionHook
    test: true
    update: friendlyName
    cost: none while no group room completes; create it with enabled false so a room cannot trigger a billed composition. Destroy deletes it
  - type: twilio:index:VideoCompositionSettings
    test: false
    reason: the settings are a single account-wide object that decides where all compositions are stored and have no delete, so a test would leave the account changed
    cost: none. Destroy forgets it
  - type: twilio:index:VideoRecordingSettings
    test: false
    reason: the settings are a single account-wide object that decides where all recordings are stored and have no delete, so a test would leave the account changed
    cost: none. Destroy forgets it
  - type: twilio:index:SuperSimNetworkAccessProfile
    test: true
    update: uniqueName
    cost: none; a Network Access Profile is free. Destroy forgets it (Twilio has no delete), so its unique name stays taken
  - type: twilio:index:SuperSimFleet
    test: true
    update: dataLimit
    cost: none until SIMs are added to the Fleet. Destroy forgets it (Twilio has no delete), so its unique name stays taken
  - type: twilio:index:WirelessRatePlan
    test: true
    update: friendlyName
    cost: none; a Rate Plan is free until SIMs use it. Destroy deletes it
  - type: twilio:index:FlexFlow
    test: true
    update: friendlyName
    cost: none; a Flex Flow is free (it needs a Chat service of the account, which is also free). Destroy deletes it
  - type: twilio:index:FlexPlugin
    test: true
    update: friendlyName
    cost: none; a Flex Plugin is free but needs a Flex-enabled account. Destroy archives it (Twilio has no delete), so its unique name stays taken
  - type: twilio:index:FlexPluginVersion
    test: true
    update: null
    cost: none; needs a FlexPlugin and a bundle URL (any https URL Twilio accepts). Every input replaces it. Destroy archives it
  - type: twilio:index:FlexPluginConfiguration
    test: true
    update: null
    cost: none; needs FlexPluginVersions. Every input replaces it. Destroy archives it
  - type: twilio:index:BrandRegistration
    test: false
    reason: a non-mock brand registration is billed by Twilio and The Campaign Registry, needs approved Customer Profile and A2P Messaging Profile bundles and cannot be deleted, so it must not run against a shared account; the mock brand (mock true) is covered by the fake-server tests and by the manual check below
  - type: twilio:index:UsAppToPerson
    test: false
    reason: an A2P campaign needs an approved (non-mock) BrandRegistration and a Messaging Service, is reviewed by The Campaign Registry and billed (a one-time vetting fee and a monthly fee), so it must not run against a shared account
  - type: twilio:index:TollfreeVerification
    test: false
    reason: a toll-free verification needs a toll-free number of the account and a real business, is reviewed by Twilio and applies to a number of the account (unverified whether it can be redone after approval), so it must not run against a shared account
  - type: twilio:index:LinkShorteningDomainConfig
    test: false
    reason: needs a link shortening domain, which Twilio sets up for the account (the spec has no call to create one), and the spec has no call to remove a domain configuration, so it must not run against a shared account
  - type: twilio:index:LinkShorteningDomainCertificate
    test: false
    reason: needs a link shortening domain set up with Twilio and a certificate and private key for it
  - type: twilio:index:LinkShorteningMessagingServiceDomain
    test: false
    reason: needs a link shortening domain set up with Twilio, which the account may not have
  - type: twilio:index:FlexPluginRelease
    test: false
    reason: releasing a Configuration changes what every Flex user of the account loads and cannot be undone or deleted, so it must not run against a shared or production Flex account
functions:
  - name: getAccount
    test: true
  - name: getAddress
    test: true
  - name: getApiKey
    test: true
  - name: getApplication
    test: true
  - name: getBalance
    test: true
  - name: getIncomingPhoneNumber
    test: true
  - name: getMessagingService
    test: true
  - name: getMessagingServicePhoneNumber
    test: true
  - name: getMessagingServiceShortCode
    test: false
    reason: needs a MessagingServiceShortCode, which needs a short code of the account
  - name: getMessagingServiceChannelSender
    test: false
    reason: needs a MessagingServiceChannelSender, which needs a channel sender of the account
  - name: getMessagingServiceAlphaSender
    test: true
  - name: getMessagingServiceDestinationAlphaSender
    test: true
  - name: getQueue
    test: true
  - name: getSigningKey
    test: true
  - name: getShortCode
    test: false
    reason: needs a short code the account already leases
  - name: getConnectApp
    test: false
    reason: needs a Connect app created by hand in the Console
  - name: getOutgoingCallerId
    test: false
    reason: needs a number the account has already verified as a caller ID
  - name: getEventSink
    test: true
  - name: getEventSubscription
    test: false
    reason: needs a subscription, which needs an active sink
  - name: getTrunk
    test: true
  - name: getTrunkOriginationUrl
    test: true
  - name: getTrunkCredentialList
    test: true
  - name: getTrunkIpAccessControlList
    test: true
  - name: getSipCredential
    test: true
  - name: getSipCredentialList
    test: true
  - name: getSipDomain
    test: true
  - name: getSipDomainCredentialListMapping
    test: true
  - name: getSipDomainIpAccessControlListMapping
    test: true
  - name: getSipIpAccessControlList
    test: true
  - name: getSipIpAddress
    test: true
  - name: getSubaccount
    test: true
  - name: getUsageTrigger
    test: true
  - name: getVerifyService
    test: true
  - name: getVerifyRateLimit
    test: true
  - name: getVerifyRateLimitBucket
    test: true
  - name: getVerifyMessagingConfiguration
    test: true
  - name: getVerifyWebhook
    test: true
  - name: getVerifySafeListNumber
    test: true
  - name: getTaskRouterWorkspace
    test: true
  - name: getTaskRouterActivity
    test: true
  - name: getTaskRouterTaskChannel
    test: true
  - name: getTaskRouterTaskQueue
    test: true
  - name: getTaskRouterWorkflow
    test: true
  - name: getTaskRouterWorker
    test: true
  - name: getConversationsService
    test: true
  - name: getConversationsServiceConfiguration
    test: true
  - name: getConversationsRole
    test: true
  - name: getConversationsCredential
    test: true
  - name: getConversationsAddressConfiguration
    test: true
  - name: getConversationsWebhookConfiguration
    test: true
  - name: getConversationsServiceNotificationConfiguration
    test: true
  - name: getConversationsConfiguration
    test: true
  - name: getSyncService
    test: true
  - name: getNotifyService
    test: true
  - name: getNotifyCredential
    test: false
    reason: needs a NotifyCredential, which needs a real push key
  - name: getIntelligenceService
    test: true
  - name: getIntelligenceCustomOperator
    test: false
    reason: needs an IntelligenceCustomOperator, which needs a real operator type configuration
  - name: getContentTemplate
    test: true
  - name: getContentApprovalStatus
    test: true
  - name: getFlexFlow
    test: true
  - name: getFlexFlows
    test: true
  - name: getFlexPlugin
    test: true
  - name: getFlexPlugins
    test: true
  - name: getFlexPluginVersion
    test: true
  - name: getFlexPluginVersions
    test: true
  - name: getFlexPluginConfiguration
    test: true
  - name: getFlexPluginConfigurations
    test: true
  - name: getFlexPluginRelease
    test: false
    reason: needs a FlexPluginRelease, which is not tested live because a Release changes what Flex loads for the whole account
  - name: getFlexPluginReleases
    test: false
    reason: needs a FlexPluginRelease, which is not tested live because a Release changes what Flex loads for the whole account
  - name: getBrandRegistration
    test: false
    reason: needs a BrandRegistration, which is not tested live because a registration is billed and cannot be deleted
  - name: getBrandRegistrations
    test: true
  - name: getUsAppToPerson
    test: false
    reason: needs a UsAppToPerson, which is not tested live because a campaign is billed and needs an approved brand
  - name: getUsAppToPersons
    test: true
  - name: getUsAppToPersonUsecases
    test: true
  - name: getTollfreeVerification
    test: false
    reason: needs a TollfreeVerification, which is not tested live because it needs a toll-free number and a real business review
